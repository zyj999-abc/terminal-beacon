<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>妈妈日记.zip - 扫描件</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    body { background: #c0c0c0; overflow: auto; }
    .win {
      position: relative; width: 90%; max-width: 820px; margin: 20px auto;
      background: #ece9d8; border: 2px solid #14539a;
    }
    .titlebar {
      background: linear-gradient(to bottom, #0058e6, #288eff); color: white;
      padding: 4px 8px; font-weight: bold; font-size: 13px;
      display: flex; justify-content: space-between;
    }
    .titlebar button {
      background: #e81123; color: white; border: 1px solid white;
      width: 22px; height: 20px; font-size: 12px; line-height: 18px; cursor: pointer;
    }
    .toolbar {
      background: #f0f0ea; border-bottom: 1px solid #b6b6b6; padding: 4px 8px;
      display: flex; gap: 6px; align-items: center; font-size: 12px;
    }
    .tb-btn { padding: 3px 8px; background: #f0f0ea; border: 1px solid #919b9c; cursor: pointer; }
    .main {
      display: flex; min-height: 560px;
    }
    .list-pane {
      width: 220px; background: white; border-right: 1px solid #b6b6b6;
      padding: 4px 0; font-size: 13px;
    }
    .list-item {
      padding: 4px 12px; cursor: default; border-bottom: 1px dotted #e0e0e0;
    }
    .list-item:hover { background: #e8f0f8; }
    .list-item.active { background: #316ac5; color: white; }
    .preview-pane {
      flex: 1; background: #5a5a5a; padding: 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .page {
      background: #f4ecd8; color: #2b2620; padding: 36px 44px;
      font-family: "KaiTi", "楷体", "SimSun", serif; line-height: 2.2;
      max-width: 560px; min-height: 480px; position: relative;
      box-shadow: 3px 3px 12px rgba(0,0,0,0.4);
      transform: rotate(-1deg);
    }
    .page h3 {
      text-align: center; margin-bottom: 18px; border-bottom: 1px solid #2b2620;
      padding-bottom: 8px; font-size: 18px;
    }
    .page .date { color: #5e4d33; font-size: 12px; text-align: right; margin-bottom: 14px; font-family: "SimSun"; }
    .page p { text-indent: 2em; margin-bottom: 14px; font-size: 15px; }
    .page .scratch { color: #888; text-decoration: line-through; }
    .page .blood { color: #800000; font-weight: bold; }
    .page .warning {
      background: #c0392b; color: #fff; padding: 8px 12px; margin: 14px 0;
      font-family: "SimSun"; font-size: 12px; text-align: center; letter-spacing: 2px;
    }
    .nav {
      position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px;
    }
    .nav button {
      background: #c0c0c0; border: 1px solid #444; padding: 4px 14px; cursor: pointer;
    }
    .statusbar {
      background: #ece9d8; border-top: 1px solid #b6b6b6; padding: 3px 8px;
      font-size: 11px; color: #444; display: flex; gap: 14px;
    }
  </style>
</head>
<body>
  <div class="win">
    <div class="titlebar">
      <span>妈妈日记.zip — /陈岚的笔记本/</span>
      <button onclick="BEACON.go('xp')">×</button>
    </div>
    <div class="toolbar">
      <button class="tb-btn" onclick="prev()">◄ 上一页</button>
      <button class="tb-btn" onclick="next()">下一页 ►</button>
      <span style="margin-left:14px" id="meta">第 1 / 4 页</span>
      <span style="margin-left:auto">扫描分辨率: 300dpi</span>
    </div>
    <div class="main">
      <div class="list-pane">
        <div class="list-item active" data-i="0">📄 封面 (无日期)</div>
        <div class="list-item" data-i="1">📄 2003-02-19 周三</div>
        <div class="list-item" data-i="2">📄 2003-02-21 周五</div>
        <div class="list-item" data-i="3">📄 2003-02-22 周六（撕页）</div>
      </div>
      <div class="preview-pane">
        <div class="page" id="page">
          <h3>陈岚的笔记本</h3>
          <div class="date">——封面——</div>
          <p>这是妈妈留给自己的小本子。她说等深儿长大了就给他看。</p>
          <p>但她还没来得及给我看。</p>
          <p style="text-align:center; margin-top:60px; color:#666; font-style:italic">
            （妈妈字迹很清秀，但有几页是后来被人补上的，下面会看到）
          </p>
        </div>
      </div>
    </div>
    <div class="statusbar">
      <span>● 全部 4 页</span>
      <span>来源：家中书桌抽屉</span>
      <span>扫描时间: 2011-07-13 14:02</span>
    </div>
  </div>

  <audio id="sfxPower" src="audio/power_off.wav" style="display:none"></audio>
  <script src="js/core.js"></script>
  <script>
    const p = document.getElementById("sfxPower");
    p.volume = 0.6;
    // 第 4 页 (撕页) 文字会触发断电效果
    const original = document.getElementById("page").innerHTML;
    function tryPlay() { p.play().catch(()=>{}); }
    document.addEventListener("click", tryPlay, { once: true });
  <script>
    const pages = [
      // 0
      `<h3>陈岚的笔记本</h3>
       <div class="date">——封面——</div>
       <p>这是妈妈留给自己的小本子。她说等深儿长大了就给他看。</p>
       <p>但她还没来得及给我看。</p>
       <p style="text-align:center; margin-top:60px; color:#666; font-style:italic">（妈妈字迹很清秀，但有几页是后来被人补上的，下面会看到）</p>`,
      // 1
      `<h3>2003 年 2 月 19 日 周三</h3>
       <div class="date">第七人民医院 · 骨科病区</div>
       <p>今天腿感觉好多了。护士说我下周二就能出院。建国（我老公）来看我，给我带了一兜他单位食堂的糖饼。他说他在网通公司最近接了一单大活，给医院老楼拉新网线，能多挣 600 块。</p>
       <p>护士 <span class="blood">赵敏</span> 今天来查房两次，第二次顺手拿走了我床头柜里的橙子，说是"消毒柜放不下了"。我没说话，她在我们这里口碑一直不好。</p>
       <p>深儿在外婆家，明天建国接他来看我。</p>
       <p>晚上窗外又下雪了。鹤岗的冬天永远下不完。</p>`,
      // 2 关键页 - 矛盾出现
      `<h3>2003 年 2 月 21 日 周五</h3>
       <div class="date">第七人民医院 · 骨科病区</div>
       <p>今天又停电了。从昨天中午开始，护士说暴风雪压断了城西的高压线，整个医院只有 UPS 撑着，暖气和电梯都没了。</p>
       <p>下午建国的电话打不通了。可能是他在外面拉网线遇到麻烦。</p>
       <p>晚上冷得睡不着，护士把一条灰绿色的军大衣拿给我，让我披着。应该是太平间那边借的，听说地下室温度能低一些。</p>
       <p><span class="scratch">不知道为什么，赵敏一直让我别下床，说"等建国来了再走"</span>。我其实想自己下床走到护士站要杯热水。</p>
       <p>明天建国说下午来。</p>`,
      // 3 撕页 - 真凶浮现
      `<h3>2003 年 2 月 22 日 周六</h3>
       <div class="date">——本应在 22 日写的字，但这是别人后来补上的——</div>
       <div class="warning">▎注意：以下为补写字迹，与前两页字迹明显不同▎</div>
       <p>2 月 22 日凌晨。手术顺利。陈岚因心脏骤停抢救无效死亡，享年 18 岁（应为 38 岁）。遗体由太平间火化，骨灰由家属陆建国签字领取。</p>
       <p>签字人：陆建国（夫）<br>
          见证人：赵敏（护士）<br>
          鉴定人：周德厚（殡仪馆馆长）<br>
          监督人：钱为民（民政局科长）</p>
       <p>备注：患者无直系亲属同意书，因其子陆深（13 岁）在外婆家，由监护人代理。</p>
       <p style="margin-top:20px; color:#666; font-size:13px">——右下角用铅笔歪歪扭扭写着一行字——</p>
       <p class="blood">"深儿，妈妈没走，妈妈在等建国来。建国让妈妈睡过去，但妈妈没死，妈妈听见他们把人推进了冷冻柜。"</p>
       <p class="blood">"深儿，妈妈现在就在那口 4 号柜里。"</p>
       <p class="blood">"2003-02-22 凌晨 3 时 17 分"</p>`
    ];
    let cur = 0;
    const pageEl = document.getElementById("page");
    const metaEl = document.getElementById("meta");
    const listItems = document.querySelectorAll(".list-item");

    function render() {
      pageEl.innerHTML = pages[cur];
      metaEl.textContent = `第 ${cur+1} / ${pages.length} 页`;
      listItems.forEach((li, i) => li.classList.toggle("active", i === cur));
    }
    function next() { cur = (cur+1) % pages.length; render(); }
    function prev() { cur = (cur-1+pages.length) % pages.length; render(); }
    listItems.forEach((li, i) => {
      li.addEventListener("click", () => { cur = i; render(); });
    });
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") next();
      if (e.key === "ArrowLeft") prev();
    });
  </script>
</body>
</html>
