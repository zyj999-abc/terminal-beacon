<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>终端信标 — 序章</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: "KaiTi", "楷体", "SimSun", serif; color: #d6cfc0; }
    .stage { position: relative; width: 100%; height: 100%; }
    .bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, #0a0807 0%, #1a120a 50%, #2c1f10 100%);
      filter: contrast(1.15) saturate(0.7);
      z-index: 0;
    }
    .scanlines {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(20,18,16,0) 50%, rgba(0,0,0,0.4) 50%);
      background-size: 100% 3px;
      pointer-events: none; z-index: 5; opacity: 0.6;
    }
    .subtitle {
      position: absolute; bottom: 18%; left: 0; width: 100%;
      text-align: center; z-index: 10; padding: 0 20px;
    }
    .subtitle .line {
      font-size: 22px; color: #f0e8d8; letter-spacing: 3px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.7);
      opacity: 0; transition: opacity 1.5s ease-in-out;
      margin-bottom: 8px; min-height: 32px;
    }
    .subtitle .line.show { opacity: 1; }
    .meta {
      position: absolute; top: 24px; left: 24px; z-index: 10;
      color: #5a4d3a; font-size: 13px; font-family: monospace; letter-spacing: 1px;
    }
    .center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 20; display: flex; flex-direction: column; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 2s ease;
    }
    .center.show { opacity: 1; pointer-events: auto; }
    .power-btn {
      background: #0a0a0a; border: 1px solid #8b6f3a; color: #d4b878;
      padding: 16px 42px; font-family: "SimSun", monospace; font-size: 16px;
      letter-spacing: 3px; cursor: pointer;
    }
    .power-btn:hover { background: #1a1208; box-shadow: 0 0 18px rgba(212,184,120,0.4); }
    .power-btn:active { background: #2a1a08; }
    .stage-end { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1.5s; z-index: 30; }
    .stage-end.on { opacity: 1; pointer-events: auto; }
    /* skip 按钮 (右上角) — 跳过字幕 */
    .skip-btn {
      position: absolute; top: 24px; right: 24px; z-index: 15;
      color: #8a7c5a; background: transparent; border: 1px solid #4a3d2a;
      padding: 4px 14px; font-size: 12px; font-family: monospace;
      letter-spacing: 1px; cursor: pointer; opacity: 0;
      transition: opacity 1s ease;
    }
    .skip-btn.show { opacity: 0.7; }
    .skip-btn:hover { opacity: 1; color: #d4b878; border-color: #8b6f3a; }
    /* 启动提示 (避免用户以为卡死) */
    .boot-hint {
      position: absolute; bottom: 4%; left: 0; width: 100%;
      text-align: center; z-index: 11;
      color: #5a4d3a; font-size: 11px; font-family: monospace; letter-spacing: 1px;
    }
    .boot-hint .progress {
      display: inline-block; width: 200px; height: 2px; background: #1a120a;
      margin-left: 12px; vertical-align: middle; position: relative;
    }
    .boot-hint .bar {
      position: absolute; top: 0; left: 0; height: 100%; background: #8b6f3a;
      width: 0%; transition: width 0.4s linear;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="scanlines"></div>
    <div class="meta">2003 → 2011 / 鹤岗 / 8 年</div>
    <button class="skip-btn" id="skip">SKIP ▶▶</button>
    <div class="subtitle" id="sub">
      <div class="line">2011 年 7 月 12 日。</div>
      <div class="line">妈妈失踪第 8 天。</div>
      <div class="line">爸爸还是说"她去省城看病了"。</div>
      <div class="line">但她的手机、身份证、医保卡，全在家里。</div>
      <div class="line">今天是暑假第一天。</div>
      <div class="line">我在阳台翻晒被褥的时候，</div>
      <div class="line">找到了那台 2003 年的旧台式机。</div>
      <div class="line">我爸在网通公司当临时工，</div>
      <div class="line">这台机器是他拉医院网线时留下来的。</div>
      <div class="line">电源一插，风扇转了八秒才起来。</div>
    </div>
    <div class="center" id="center">
      <button class="power-btn" id="power">按下电源键</button>
    </div>
    <div class="boot-hint" id="hint">▶ 系统启动中...<div class="progress"><div class="bar" id="bar"></div></div></div>
    <div class="stage-end" id="endStage"></div>
  </div>
  <audio id="bgm" src="audio/blizzard.wav" loop preload="auto" style="display:none"></audio>
  <script>
    const bgm = document.getElementById("bgm");
    bgm.volume = 0.2;
    document.addEventListener("click", () => bgm.play().catch(()=>{}), { once: true });
    document.addEventListener("keydown", () => bgm.play().catch(()=>{}), { once: true });
  </script>
  <script>
    const lines = document.querySelectorAll("#sub .line");
    const center = document.getElementById("center");
    const endStage = document.getElementById("endStage");
    const skip = document.getElementById("skip");
    let i = 0;
    let timers = [];

    function clearAllTimers() {
      timers.forEach(t => clearTimeout(t));
      timers = [];
    }

    function showPower() {
      center.classList.add("show");
      skip.classList.remove("show");
      const hint = document.getElementById("hint");
      if (hint) hint.style.opacity = "0";
    }

    function next() {
      if (i < lines.length) {
        lines[i].classList.add("show");
        // 更新进度条
        const bar = document.getElementById("bar");
        if (bar) bar.style.width = (((i + 1) / lines.length) * 100) + "%";
        timers.push(setTimeout(() => {
          lines[i].classList.remove("show");
          i++;
          timers.push(setTimeout(next, 600));
        }, 2600));
      } else {
        showPower();
      }
    }

    // 启动字幕 (立即开始 - 第 1 句立刻显示, 给用户"在动"的反馈)
    timers.push(setTimeout(next, 300));
    // 3 秒后显示 skip 按钮
    timers.push(setTimeout(() => skip.classList.add("show"), 3000));

    function gotoXP() {
      clearAllTimers();
      center.style.pointerEvents = "none";
      endStage.classList.add("on");
      timers.push(setTimeout(() => { window.location.href = "xp.html"; }, 1800));
    }

    document.getElementById("power").addEventListener("click", gotoXP);
    document.getElementById("skip").addEventListener("click", gotoXP);

    // Enter 键也跳过
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") gotoXP();
    });
  </script>
</body>
</html>
