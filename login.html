<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>登录 - 终端信标</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    .login-bg {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #1e3a72 0%, #0c1e3f 100%);
      z-index: -1;
    }
    .login-window {
      position: absolute; top: 38%; left: 50%; transform: translateX(-50%);
      width: 360px;
    }
    .hint-pic {
      position: absolute; right: -260px; top: 80px; width: 240px;
      background: #f0ead0; border: 1px solid #c4b896; padding: 16px;
      font-family: "KaiTi", "楷体", serif; font-size: 12px; line-height: 1.8;
      transform: rotate(3deg); box-shadow: 3px 3px 12px rgba(0,0,0,0.3);
    }
    .hint-pic::before {
      content: ""; position: absolute; top: -8px; left: 50%;
      width: 60px; height: 16px;
      background: rgba(255,235,150,0.6);
    }
    @media (max-width: 700px) { .hint-pic { display: none; } }
    .login-title {
      color: white; font-size: 28px; text-align: center;
      font-family: "Microsoft YaHei", "黑体", sans-serif;
      margin-bottom: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }
    .login-sub {
      color: #b8c5db; text-align: center; font-size: 12px;
      margin-bottom: 30px; letter-spacing: 1px;
    }
    .user-row {
      display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
      color: white; font-size: 13px;
    }
    .user-icon {
      width: 36px; height: 36px;
      background: radial-gradient(circle, #ffd67a 0%, #c98800 80%);
      border-radius: 50%; border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #4a3a0a;
    }
    .avatars {
      display: flex; gap: 12px; padding: 12px 0;
    }
    .avatar {
      width: 48px; height: 48px; border: 2px solid transparent;
      border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }
    .avatar.on { border-color: #f5b800; background: rgba(245,184,0,0.15); }
    .login-form { display: flex; flex-direction: column; gap: 6px; }
    .login-form label { color: white; font-size: 12px; }
    .login-form input {
      padding: 6px 10px; border: 1px solid #14539a; background: white;
      font-size: 14px; outline: none;
    }
    .login-actions {
      display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;
    }
    .login-actions button {
      padding: 6px 18px; border: 1px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.25); color: white; cursor: pointer;
      backdrop-filter: blur(2px);
    }
    .login-actions button.primary { background: #1e6ec8; border-color: #1e6ec8; }
    .login-actions button:hover { background: rgba(255,255,255,0.1); }
    .login-actions button.primary:hover { background: #2980d9; }
    .err {
      color: #ff5757; font-size: 12px; min-height: 16px; margin-top: 4px;
      display: none;
    }
    .err.show { display: block; }
  </style>
</head>
<body>
  <div class="login-bg"></div>
  <div class="scanlines"></div>

  <div class="login-window">
    <div class="login-title">终端信标</div>
    <div class="login-sub">Netcom Maintenance System 2003</div>

    <div class="user-row">
      <div class="user-icon">陆</div>
      <div>
        <div style="font-size:14px">陆深 (本地用户)</div>
        <div style="font-size:11px; opacity:0.7">2011-07-13 首次登录</div>
      </div>
    </div>

    <div class="avatars">
      <div class="avatar on" title="陆深">🧑</div>
      <div class="avatar" title="管理员 (受限)" style="opacity:0.4">👤</div>
    </div>

    <form class="login-form" id="loginForm" autocomplete="off">
      <label for="pw">密码 (Password)</label>
      <input type="password" id="pw" autofocus placeholder="••••••••">
      <div class="err" id="err">密码错误，请重试。</div>
      <div class="login-actions">
        <button type="button" onclick="BEACON.go('line')">跳过 (Skip)</button>
        <button type="submit" class="primary">登录</button>
      </div>
    </form>
  </div>

  <!-- 桌面贴纸：密码提示 -->
  <div class="hint-pic">
    <strong>密码提示：</strong><br>
    妈妈用过的网名<br>
    （4 字拼音）<br>
    + 她的生日<br>
    <span style="color:#888">—— 2003 年她 QQ 签名档</span>
  </div>

  <div class="taskbar">
    <button class="start-btn" onclick="BEACON.go('xp')">start</button>
    <div style="color:white; font-size:12px; padding:0 14px;">陆深登录中...</div>
    <div class="system-tray"><span id="tray-time">11:43</span><span>🔊</span></div>
  </div>

  <script src="js/core.js"></script>
  <audio id="sfxDial" src="audio/dialup.wav" style="display:none"></audio>
  <script>
    const dial = document.getElementById("sfxDial");
    dial.volume = 0.4;
    document.addEventListener("click", () => dial.play().catch(()=>{}), { once: true });
  <script>
    function tick() {
      const d = new Date();
      const pad = n => n < 10 ? "0"+n : n;
      document.getElementById("tray-time").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    }
    tick(); setInterval(tick, 30000);

    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      const pw = document.getElementById("pw").value;
      if (pw === BEACON.PASSWORDS.xpLogin) {
        document.getElementById("err").classList.remove("show");
        const form = document.getElementById("loginForm");
        form.style.transition = "opacity 0.4s";
        form.style.opacity = "0.4";
        setTimeout(() => BEACON.go("line"), 500);
      } else {
        const err = document.getElementById("err");
        err.classList.add("show");
        const pwInput = document.getElementById("pw");
        pwInput.value = "";
        pwInput.style.border = "1px solid #ff5757";
        setTimeout(() => pwInput.style.border = "1px solid #14539a", 1200);
      }
    });

    document.querySelectorAll(".avatar").forEach(a => {
      a.addEventListener("click", () => {
        document.querySelectorAll(".avatar").forEach(x => x.classList.remove("on"));
        a.classList.add("on");
      });
    });
  </script>
</body>
</html>
